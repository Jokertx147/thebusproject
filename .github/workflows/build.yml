name: Build

# Builds every push, so a mistake in the user interface code shows up here before anyone pulls it,
# and leaves ready-to-run downloads under the run's "Artifacts".

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  linux:
    name: Linux (Avalonia app + headless test)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # to put the screenshots on the ci-screenshots branch (the run's artifacts can't be fetched everywhere)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the game logic
        run: |
          dotnet build TheBusProject.Core/TheBusProject.Core.csproj -c Release
          dotnet build TheBusProject.Presentation/TheBusProject.Presentation.csproj -c Release

      - name: Build the Linux app (Avalonia)
        run: dotnet build TheBusProject.Desktop/TheBusProject.Desktop.csproj -c Release

      - name: Quick game test (new game, newest pages)
        run: |
          dotnet build TheBusProject.Headless/TheBusProject.Headless.csproj -c Release
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm quick 2>&1 | tee quicktest.log
          grep -q "QUICK TEST OK" quicktest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " quicktest.log | sed 's/^/::error::/'; exit 1; }

      - name: Scenario test (two scenarios from the main menu, a lost one, save and load)
        run: |
          TAP_SCEN="Deregulation,The Curbside" timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm scenario 2>&1 | tee scenariotest.log
          grep -q "SCENARIO TEST OK" scenariotest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " scenariotest.log | sed 's/^/::error::/'; exit 1; }

      - name: Game area test (an old save with the whole world, cleaned up from Options)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm bloat 2>&1 | tee bloattest.log
          grep -q "BLOAT TEST OK" bloattest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " bloattest.log | sed 's/^/::error::/'; exit 1; }

      - name: Replace coach test (one coach of a route replaced by another on the route screen)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm replace 2>&1 | tee replacetest.log
          grep -q "REPLACE TEST OK" replacetest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " replacetest.log | sed 's/^/::error::/'; exit 1; }

      - name: Fleet renewal test (every coach of one type replaced by another from the market)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm renewal 2>&1 | tee renewaltest.log
          grep -q "RENEWAL TEST OK" renewaltest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " renewaltest.log | sed 's/^/::error::/'; exit 1; }

      - name: Fleet renewal order test (a new coach ordered, saved and loaded, taking over on delivery)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm renewalorder 2>&1 | tee renewalordertest.log
          grep -q "RENEWAL ORDER TEST OK" renewalordertest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " renewalordertest.log | sed 's/^/::error::/'; exit 1; }

      - name: Bay test (a 45 foot coach against a platform extended 1 m at a time)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm bay 2>&1 | tee baytest.log
          grep -q "BAY TEST OK" baytest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " baytest.log | sed 's/^/::error::/'; exit 1; }

      - name: Route profit test (two routes flown for six weeks, then the report)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm routeprofit 2>&1 | tee routeprofittest.log
          grep -q "ROUTE PROFIT TEST OK" routeprofittest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " routeprofittest.log | sed 's/^/::error::/'; exit 1; }

      - name: Route forecast test (the planner's suggestion and forecast against a month of flying)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm forecast 2>&1 | tee forecasttest.log
          grep -q "FORECAST TEST OK" forecasttest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " forecasttest.log | sed 's/^/::error::/'; exit 1; }

      - name: Computer carriers test (destinations picked by forecast, losing routes given up)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm aiplan 2>&1 | tee aiplantest.log
          grep -q "AI PLAN TEST OK" aiplantest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " aiplantest.log | sed 's/^/::error::/'; exit 1; }

      - name: World map animation test (coach glide between reads of the game)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm mapanim 2>&1 | tee mapanimtest.log
          grep -q "MAP ANIMATION TEST OK" mapanimtest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " mapanimtest.log | sed 's/^/::error::/'; exit 1; }

      - name: Competitors test (rivals on my routes and stations, their moves, the screen)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm competitors 2>&1 | tee competitorstest.log
          grep -q "COMPETITORS TEST OK" competitorstest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " competitorstest.log | sed 's/^/::error::/'; exit 1; }

      - name: Rivals on the map test (one carrier, those on my routes, everyone at an station)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm rivalmap 2>&1 | tee rivalmaptest.log
          grep -q "RIVAL MAP TEST OK" rivalmaptest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " rivalmaptest.log | sed 's/^/::error::/'; exit 1; }

      - name: Connecting passengers test (the trip engine's quick sum equals the markets)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm fastdemand 2>&1 | tee fastdemandtest.log
          grep -q "FAST DEMAND TEST OK" fastdemandtest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " fastdemandtest.log | sed 's/^/::error::/'; exit 1; }

      - name: Round trip advice test (the forecast's extra round trip against a month flown with and without it)
        run: |
          TAP_OPPONENTS=20 TAP_SAMPLE=40 timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm tripadvice 2>&1 | tee tripadvicetest.log
          grep -q "TRIP ADVICE TEST OK" tripadvicetest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " tripadvicetest.log | sed 's/^/::error::/'; exit 1; }

      - name: Follow an coach on the map test
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm follow 2>&1 | tee followtest.log
          grep -q "FOLLOW TEST OK" followtest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " followtest.log | sed 's/^/::error::/'; exit 1; }

      - name: Trip board test (a followed coach's trips through a day)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm board 2>&1 | tee boardtest.log
          grep -q "TRIP BOARD TEST OK" boardtest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " boardtest.log | sed 's/^/::error::/'; exit 1; }

      - name: Demand both ways test (a new game's carrier stations get passengers towards them too)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm onewaytest 2>&1 | tee onewaytest.log
          grep -q "DEMAND BOTH WAYS TEST OK" onewaytest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " onewaytest.log | sed 's/^/::error::/'; exit 1; }

      - name: History test (rival moves and recorded trips come back with a saved game)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm history 2>&1 | tee historytest.log
          grep -q "HISTORY TEST OK" historytest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " historytest.log | sed 's/^/::error::/'; exit 1; }

      - name: Demand audit test (data figures, no gaps, the same after a load and a new year)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm demandaudit 2>&1 | tee demandaudittest.log
          grep -q "DEMAND AUDIT TEST OK" demandaudittest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " demandaudittest.log | sed 's/^/::error::/'; exit 1; }

      - name: Save size test (a smaller save shows the same figures, facilities and shares)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm savesize 2>&1 | tee savesizetest.log
          grep -q "SAVE SIZE TEST OK" savesizetest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " savesizetest.log | sed 's/^/::error::/'; exit 1; }

      - name: Rival alerts test
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm rivalalerts 2>&1 | tee rivalalerts.log
          grep -q "RIVAL ALERTS TEST OK" rivalalerts.log || { grep -m8 -iE "FAILED|timeout|exception|   at " rivalalerts.log | sed 's/^/::error::/'; exit 1; }

      - name: Monthly report test
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm report 2>&1 | tee reporttest.log
          grep -q "REPORT TEST OK" reporttest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " reporttest.log | sed 's/^/::error::/'; exit 1; }

      - name: Route suggestions test
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm suggest 2>&1 | tee suggest.log
          grep -q "SUGGEST TEST OK" suggest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " suggest.log | sed 's/^/::error::/'; exit 1; }

      - name: Order ahead test
        run: |
          TAP_YEAR=1994 timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm orderahead 2>&1 | tee orderahead.log
          grep -q "ORDER AHEAD TEST OK" orderahead.log || { grep -m8 -iE "FAILED|timeout|exception|   at " orderahead.log | sed 's/^/::error::/'; exit 1; }

      - name: Engines test
        run: |
          TAP_YEAR=1996 timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm engines 2>&1 | tee engines.log
          grep -q "ENGINES TEST OK" engines.log || { grep -m8 -iE "FAILED|timeout|exception|   at " engines.log | sed 's/^/::error::/'; exit 1; }

      - name: Statistics test
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm stats 2>&1 | tee statstest.log
          grep -q "STATS TEST OK" statstest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " statstest.log | sed 's/^/::error::/'; exit 1; }

      - name: Reputation forecast test
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm reputation 2>&1 | tee reputation.log
          grep -q "REPUTATION TEST OK" reputation.log || { grep -m8 -iE "FAILED|timeout|exception|   at " reputation.log | sed 's/^/::error::/'; exit 1; }

      - name: Statistics screen test
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm statistics 2>&1 | tee statisticsscreen.log
          grep -q "STATISTICS TEST OK" statisticsscreen.log || { grep -m8 -iE "FAILED|timeout|exception|   at " statisticsscreen.log | sed 's/^/::error::/'; exit 1; }

      - name: Station search test
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm stationsearch 2>&1 | tee stationsearch.log
          grep -q "STATION SEARCH TEST OK" stationsearch.log || { grep -m8 -iE "FAILED|timeout|exception|   at " stationsearch.log | sed 's/^/::error::/'; exit 1; }

      - name: Station sort test
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm stationsort 2>&1 | tee stationsort.log
          grep -q "STATION SORT TEST OK" stationsort.log || { grep -m8 -iE "FAILED|timeout|exception|   at " stationsort.log | sed 's/^/::error::/'; exit 1; }

      - name: Empty route test
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm aiempty 2>&1 | tee aiempty.log
          grep -q "EMPTY ROUTE TEST OK" aiempty.log || { grep -m8 -iE "FAILED|timeout|exception|   at " aiempty.log | sed 's/^/::error::/'; exit 1; }

      - name: Best and worst test (profit per route and per coach)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm ranking 2>&1 | tee ranking.log
          grep -q "RANKING TEST OK" ranking.log || { grep -m8 -iE "FAILED|timeout|exception|   at " ranking.log | sed 's/^/::error::/'; exit 1; }

      - name: Ground time test (the gap between trips is the coach's ground time)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm groundtime 2>&1 | tee groundtime.log
          grep -q "GROUND TIME TEST OK" groundtime.log || { grep -m8 -iE "FAILED|timeout|exception|   at " groundtime.log | sed 's/^/::error::/'; exit 1; }

      - name: Cabins test (every coach can say which cabin a passenger sits in)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm cabins 2>&1 | tee cabins.log
          grep -q "CABINS TEST OK" cabins.log || { grep -m8 -iE "FAILED|timeout|exception|   at " cabins.log | sed 's/^/::error::/'; exit 1; }

      - name: Break-even fare test
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm breakeven 2>&1 | tee breakeven.log
          grep -q "BREAK EVEN TEST OK" breakeven.log || { grep -m8 -iE "FAILED|timeout|exception|   at " breakeven.log | sed 's/^/::error::/'; exit 1; }

      - name: Stops test (a service calling at stops, Greyhound style)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm stops 2>&1 | tee stops.log
          grep -q "STOPS TEST OK" stops.log || { grep -m8 -iE "FAILED|timeout|exception|   at " stops.log | sed 's/^/::error::/'; exit 1; }

      - name: Roads test (routes that follow the interstates)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm roads 2>&1 | tee roads.log
          grep -q "ROADS TEST OK" roads.log || { grep -m8 -iE "FAILED|timeout|exception|   at " roads.log | sed 's/^/::error::/'; exit 1; }

      - name: Upgrade test (re-powering a coach you own, and what your own garage saves)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm upgrade 2>&1 | tee upgrade.log
          grep -q "UPGRADE TEST OK" upgrade.log || { grep -m8 -iE "FAILED|timeout|exception|   at " upgrade.log | sed 's/^/::error::/'; exit 1; }

      - name: Milestone test
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm milestone 2>&1 | tee milestone.log
          grep -q "MILESTONE TEST OK" milestone.log || { grep -m8 -iE "FAILED|timeout|exception|   at " milestone.log | sed 's/^/::error::/'; exit 1; }

      - name: Schedule test
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm schedule 2>&1 | tee scheduletest.log
          grep -q "SCHEDULE TEST OK" scheduletest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " scheduletest.log | sed 's/^/::error::/'; exit 1; }

      - name: Fast-forward test (a day, a week, next month, stopped by Pause and by low cash)
        run: |
          timeout 900 dotnet run --no-build -c Release --project TheBusProject.Headless -- vm skip 2>&1 | tee skiptest.log
          grep -q "SKIP TEST OK" skiptest.log || { grep -m8 -iE "FAILED|timeout|exception|   at " skiptest.log | sed 's/^/::error::/'; exit 1; }

      - name: Screenshot mode (the newer screens drawn under a virtual display)
        run: |
          sudo apt-get install -y -qq xvfb > /dev/null
          xvfb-run -a -s "-screen 0 1600x1000x24" timeout 900 dotnet run --no-build -c Release --project TheBusProject.Desktop -- --screenshots shots || true
          cat shots/progress.txt || true
          grep -q " done$" shots/progress.txt || { (cat shots/error.txt 2>/dev/null || echo "no screenshots were made") | head -12 | sed 's/^/::error::/'; exit 1; }
          ls -la shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-linux
          path: shots
          if-no-files-found: ignore

      # also on an orphan branch, force-pushed, so the pictures can be looked at with a plain git fetch
      - name: Put the screenshots on the ci-screenshots branch
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/shots && cp -r shots /tmp/shots
          git checkout --orphan ci-screenshots
          git rm -rf --cached . > /dev/null
          rm -rf shots
          mkdir -p shots && cp /tmp/shots/* shots/
          echo "The Avalonia app's newer screens, drawn by CI under a virtual display at every push to" > README.md
          echo "main. Replaced each time; not part of the game's history." >> README.md
          echo "From commit ${GITHUB_SHA}." >> README.md
          git add -A shots README.md
          git commit -q -m "Screenshots from ${GITHUB_SHA}"
          git push -q --force origin ci-screenshots

      - name: Publish a ready-to-run Linux build
        run: |
          dotnet publish TheBusProject.Desktop/TheBusProject.Desktop.csproj -c Release -r linux-x64 --self-contained true -o publish/TheBusProject
          rsync -a --exclude 'saves' Data/Data/ publish/TheBusProject/data/
          chmod +x publish/TheBusProject/TheBusProject.Desktop
          cat > publish/TheBusProject/start.sh <<'EOF'
          #!/bin/sh
          cd "$(dirname "$0")" && exec ./TheBusProject.Desktop "$@"
          EOF
          chmod +x publish/TheBusProject/start.sh
          tar -czf TheBusProject-Linux-x64.tar.gz -C publish TheBusProject

      - uses: actions/upload-artifact@v4
        with:
          name: TheBusProject-Linux-x64
          path: TheBusProject-Linux-x64.tar.gz
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-test-log
          path: quicktest.log
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Windows (the game)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish the Avalonia app for Windows
        shell: pwsh
        run: |
          dotnet publish TheBusProject.Desktop/TheBusProject.Desktop.csproj -c Release -r win-x64 --self-contained true -o publish/TheBusProject
          robocopy Data/Data publish/TheBusProject/data /E /XD saves /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE } else { exit 0 }

      - uses: actions/upload-artifact@v4
        with:
          name: TheBusProject-Avalonia-Windows-x64
          path: publish/TheBusProject
          retention-days: 14
